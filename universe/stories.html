</style><style id="darktec-image-lightbox-css">

(()=>{const links=[...document.querySelectorAll('.original-image-link')];if(!links.length)return;
const box=document.createElement('div');box.id='darktec-lightbox';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label','Image viewer');
box.innerHTML='<button class="lb-close" type="button" aria-label="Close">×</button><button class="lb-prev" type="button" aria-label="Previous image">‹</button><img alt=""><button class="lb-next" type="button" aria-label="Next image">›</button><div class="lb-counter"></div>';document.body.appendChild(box);
const image=box.querySelector('img'),counter=box.querySelector('.lb-counter');let current=0;
function show(n){current=(n+links.length)%links.length;const a=links[current];image.src=a.href;image.alt=a.querySelector('img')?.alt||'DARKTEC artwork';counter.textContent=(current+1)+' / '+links.length;}
function open(n){show(n);box.classList.add('is-open');document.body.style.overflow='hidden';box.querySelector('.lb-close').focus();}
function close(){box.classList.remove('is-open');document.body.style.overflow='';image.removeAttribute('src');}
links.forEach((a,n)=>{a.removeAttribute('target');a.addEventListener('click',e=>{e.preventDefault();open(n);});});
box.querySelector('.lb-close').addEventListener('click',close);box.querySelector('.lb-prev').addEventListener('click',()=>show(current-1));box.querySelector('.lb-next').addEventListener('click',()=>show(current+1));
box.addEventListener('click',e=>{if(e.target===box)close();});
document.addEventListener('keydown',e=>{if(!box.classList.contains('is-open'))return;if(e.key==='Escape')close();if(e.key==='ArrowLeft')show(current-1);if(e.key==='ArrowRight')show(current+1);});
let touchX=0;box.addEventListener('touchstart',e=>{touchX=e.changedTouches[0].screenX;},{passive:true});box.addEventListener('touchend',e=>{const dx=e.changedTouches[0].screenX-touchX;if(Math.abs(dx)>55)show(current+(dx<0?1:-1));},{passive:true});
})();
</script></body></html>
