name: DARKTEC Free Daily Intelligence to Telegram

on:
  workflow_dispatch:
  schedule:
    # 08:00 Europe/Berlin during CET (winter); change to 06:00 UTC during CEST (summer).
    - cron: "0 7 * * *"

permissions:
  contents: read

jobs:
  collect-and-deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect free RSS news and build briefing
        env:
          TZ: Europe/Berlin
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET
          import html, re, time
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from pathlib import Path

          # Free public RSS sources. No paid API or AI inference is used.
          feeds = [
            ("WORLD WATCH", "https://feeds.bbci.co.uk/news/world/rss.xml"),
            ("WORLD WATCH", "https://www.tagesschau.de/xml/rss2/"),
            ("CRUISE WATCH", "https://news.google.com/rss/search?q=" + urllib.parse.quote('Disney Cruise Line OR TUI Cruises OR Mein Schiff OR AIDA Cruises OR Royal Caribbean')),
            ("MARITIME & WEATHER", "https://news.google.com/rss/search?q=" + urllib.parse.quote('cruise ship maritime port disruption storm hurricane shipping')),
            ("FESTIVAL WATCH", "https://news.google.com/rss/search?q=" + urllib.parse.quote('music festival 2027 lineup announcement Europe worldwide')),
            ("FESTIVAL INDUSTRY & CAREERS", "https://news.google.com/rss/search?q=" + urllib.parse.quote('live events production technician lighting audio stage crew jobs festival')),
            ("TECH & AI WATCH", "https://feeds.arstechnica.com/arstechnica/technology-lab"),
            ("TECH & AI WATCH", "https://techcrunch.com/feed/"),
            ("SPACE & SCIENCE", "https://www.nasa.gov/rss/dyn/breaking_news.rss"),
            ("SPACE & SCIENCE", "https://www.esa.int/rssfeed/Our_Activities/Space_News"),
            ("AVIATION WATCH", "https://news.google.com/rss/search?q=" + urllib.parse.quote('aviation airline route aircraft safety airspace Europe')),
            ("MARKETS & ECONOMY", "https://news.google.com/rss/search?q=" + urllib.parse.quote('DAX S&P 500 Nasdaq European markets central bank economy')),
            ("BITCOIN & DIGITAL ASSETS", "https://news.google.com/rss/search?q=" + urllib.parse.quote('Bitcoin cryptocurrency market regulation')),
            ("CASH & DIGITAL EURO", "https://news.google.com/rss/search?q=" + urllib.parse.quote('"digital euro" OR cash payments ECB EU')),
            ("CYBERSECURITY", "https://news.google.com/rss/search?q=" + urllib.parse.quote('cybersecurity data breach vulnerability cyber attack')),
          ]

          def clean(s):
              s = re.sub(r'<[^>]+>', ' ', s or '')
              s = html.unescape(s)
              return re.sub(r'\\s+', ' ', s).strip()

          def parse_date(s):
              if not s: return None
              try:
                  d = parsedate_to_datetime(s)
                  if d.tzinfo is None: d = d.replace(tzinfo=timezone.utc)
                  return d
              except Exception:
                  return None

          sections = {}
          errors = []
          cutoff = time.time() - 48 * 3600
          for category, url in feeds:
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"DARKTEC-World-Intelligence/1.0 (RSS reader)"})
                  with urllib.request.urlopen(req, timeout=18) as resp:
                      raw = resp.read(2_500_000)
                  root = ET.fromstring(raw)
                  entries = root.findall(".//item")
                  if not entries:
                      entries = root.findall(".//{http://www.w3.org/2005/Atom}entry")
                  for item in entries:
                      title = item.findtext("title") or item.findtext("{http://www.w3.org/2005/Atom}title") or ""
                      link = item.findtext("link") or ""
                      if not link:
                          link_el = item.find("{http://www.w3.org/2005/Atom}link")
                          if link_el is not None: link = link_el.attrib.get("href","")
                      desc = item.findtext("description") or item.findtext("{http://www.w3.org/2005/Atom}summary") or ""
                      date_s = item.findtext("pubDate") or item.findtext("{http://www.w3.org/2005/Atom}published") or item.findtext("{http://www.w3.org/2005/Atom}updated") or ""
                      dt = parse_date(date_s)
                      if dt and dt.timestamp() < cutoff: continue
                      title, desc = clean(title), clean(desc)
                      if not title or not link: continue
                      sections.setdefault(category, [])
                      if any(x["title"].lower() == title.lower() for x in sections[category]): continue
                      sections[category].append({"title":title, "desc":desc[:420], "link":link, "date":dt})
              except Exception as e:
                  errors.append(category + ": " + type(e).__name__)

          now = datetime.now().astimezone()
          lines = [
            "🌍 Guten Morgen, Lord DarkTec!",
            "Hier ist Ihr persönliches World Intelligence Center.",
            f"Daily Intelligence Briefing – {now.strftime('%A, %d.%m.%Y %H:%M %Z')}",
            "",
            "🧭 FREE EDITION – RSS-NACHRICHTENÜBERBLICK",
            "Automatisch aus frei verfügbaren RSS-Feeds zusammengestellt. Kein KI-generierter Lagebericht; Meldungen bitte über die verlinkten Quellen prüfen.",
            ""
          ]
          order = ["WORLD WATCH","CRUISE WATCH","MARITIME & WEATHER","FESTIVAL WATCH","FESTIVAL INDUSTRY & CAREERS","TECH & AI WATCH","SPACE & SCIENCE","AVIATION WATCH","MARKETS & ECONOMY","BITCOIN & DIGITAL ASSETS","CASH & DIGITAL EURO","CYBERSECURITY"]
          for category in order:
              items = sections.get(category, [])
              lines.append("━━━━━━━━━━━━━━━━━━")
              lines.append("📌 " + category)
              if not items:
                  lines.append("Keine passenden Meldungen aus den abgefragten Feeds in den letzten 48 Stunden gefunden.")
                  continue
              # At most 5 per category; newest first where dates exist.
              items.sort(key=lambda x: x["date"] or datetime.min.replace(tzinfo=timezone.utc), reverse=True)
              for item in items[:5]:
                  lines.append("• " + item["title"])
                  if item["desc"]: lines.append("  " + item["desc"])
                  lines.append("  Quelle: " + item["link"])
          lines += [
            "",
            "━━━━━━━━━━━━━━━━━━",
            "💶 MARKTDATEN / BITCOIN",
            "Dieser kostenlose RSS-Lauf liefert keine verlässlichen Echtzeitkurse. Für aktuelle Index-, FX- und Kryptokurse bitte die verlinkten Finanzquellen prüfen; hier werden keine Werte erfunden.",
            "",
            "🧠 PROFESSIONELLE EINORDNUNG",
            "Dies ist eine automatische Nachrichtensammlung, keine verifizierte Mehrquellenanalyse. RSS-Abdeckung ist je nach Thema begrenzt; AIS-Positionen, vollständige Flottenfahrpläne, Wetterwarnungen und Festival-HOLD-Status werden nicht automatisch bestätigt.",
            "",
            "🔎 DATENQUALITÄT",
            f"Abgefragte Feeds: {len(feeds)} | Abrufprobleme: {len(errors)} | Zeitfenster: letzte 48 Stunden.",
            "Was hat sich seit dem letzten Bericht geändert? Ein belastbarer Vergleich wird in dieser kostenlosen RSS-Version noch nicht gespeichert."
          ]
          if errors:
              lines += ["", "Nicht erreichbare Feeds: " + ", ".join(errors[:10])]
          Path("/tmp/briefing.txt").write_text("\\n".join(lines), encoding="utf-8")
          print(f"Collected {sum(len(v) for v in sections.values())} items across {len(sections)} sections.")
          PY

      - name: Send briefing to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, json, time
          from pathlib import Path
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "")
          chat = os.environ.get("TELEGRAM_CHAT_ID", "")
          if not token or not chat:
              raise SystemExit("Missing TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID repository secret.")
          text = Path("/tmp/briefing.txt").read_text(encoding="utf-8").strip()
          # Telegram sendMessage limit is 4096 characters; split on paragraph boundaries.
          chunks = []
          while text:
              if len(text) <= 3800:
                  chunks.append(text); break
              cut = text.rfind("\\n\\n", 0, 3800)
              if cut < 1500: cut = text.rfind("\\n", 0, 3800)
              if cut < 1: cut = 3800
              chunks.append(text[:cut].strip())
              text = text[cut:].strip()
          for i, chunk in enumerate(chunks, 1):
              data = urllib.parse.urlencode({"chat_id":chat, "text":chunk, "disable_web_page_preview":"true"}).encode()
              req = urllib.request.Request(f"https://api.telegram.org/bot{token}/sendMessage", data=data)
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read().decode())
              if not result.get("ok"): raise RuntimeError(f"Telegram error on part {i}: {result}")
              print(f"Sent Telegram part {i}/{len(chunks)}")
              time.sleep(1)
          PY
